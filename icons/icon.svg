<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Laser Beam Glow -->
    <linearGradient id="beamGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#818cf8" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#c084fc" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="1"/>
    </linearGradient>

    <radialGradient id="focalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f43f5e" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nozzleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="30%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="partGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <filter id="laserGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="tileTL"><rect x="86" y="86" width="154" height="154" rx="10"/></clipPath>
    <clipPath id="tileTR"><rect x="272" y="86" width="154" height="154" rx="10"/></clipPath>
    <clipPath id="tileBL"><rect x="86" y="272" width="154" height="154" rx="10"/></clipPath>
    <clipPath id="tileBR"><rect x="272" y="272" width="154" height="154" rx="10"/></clipPath>
  </defs>

  <!-- App Rounded Icon Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#334155" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Precision Measurement Grid / Reticle Background -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.4"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2,4" opacity="0.25"/>
  <line x1="256" y1="56" x2="256" y2="456" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4"/>
  <line x1="56" y1="256" x2="456" y2="256" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4"/>

  <!-- Exploded 2x2 Printable Tiles -->
  <g fill="url(#partGrad)" stroke="#475569" stroke-width="2.5">
    <rect x="86" y="86" width="154" height="154" rx="10"/>
    <rect x="272" y="86" width="154" height="154" rx="10"/>
    <rect x="86" y="272" width="154" height="154" rx="10"/>
    <rect x="272" y="272" width="154" height="154" rx="10"/>
  </g>

  <!-- Glowing Stencil Shape Split Across All 4 Tiles -->
  <g filter="url(#laserGlow)">
    <g clip-path="url(#tileTL)">
      <path d="M 256,112 L 296,216 L 400,256 L 296,296 L 256,400 L 216,296 L 112,256 L 216,216 Z" fill="url(#beamGrad)" opacity="0.92"/>
      <circle cx="256" cy="256" r="98" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.7"/>
    </g>
    <g clip-path="url(#tileTR)">
      <path d="M 256,112 L 296,216 L 400,256 L 296,296 L 256,400 L 216,296 L 112,256 L 216,216 Z" fill="url(#beamGrad)" opacity="0.92"/>
      <circle cx="256" cy="256" r="98" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.7"/>
    </g>
    <g clip-path="url(#tileBL)">
      <path d="M 256,112 L 296,216 L 400,256 L 296,296 L 256,400 L 216,296 L 112,256 L 216,216 Z" fill="url(#beamGrad)" opacity="0.92"/>
      <circle cx="256" cy="256" r="98" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.7"/>
    </g>
    <g clip-path="url(#tileBR)">
      <path d="M 256,112 L 296,216 L 400,256 L 296,296 L 256,400 L 216,296 L 112,256 L 216,216 Z" fill="url(#beamGrad)" opacity="0.92"/>
      <circle cx="256" cy="256" r="98" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.7"/>
    </g>
  </g>

  <!-- Cyan Dashed Split Seam Lines Through Gaps -->
  <line x1="256" y1="62" x2="256" y2="450" stroke="#06b6d4" stroke-width="3" stroke-dasharray="8,6"/>
  <line x1="62" y1="256" x2="450" y2="256" stroke="#06b6d4" stroke-width="3" stroke-dasharray="8,6"/>

  <!-- Amber Crop / Alignment Corner Marks -->
  <g fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 98,116 L 98,98 L 116,98"/>
    <path d="M 396,98 L 414,98 L 414,116"/>
    <path d="M 98,396 L 98,414 L 116,414"/>
    <path d="M 396,414 L 414,414 L 414,396"/>
    <!-- Inner seam alignment crosshairs -->
    <path d="M 222,228 L 234,228 M 228,222 L 228,234"/>
    <path d="M 278,228 L 290,228 M 284,222 L 284,234"/>
    <path d="M 222,284 L 234,284 M 228,278 L 228,290"/>
    <path d="M 278,284 L 290,284 M 284,278 L 284,290"/>
  </g>

  <!-- Center Seam Focal Node -->
  <circle cx="256" cy="256" r="22" fill="url(#focalGlow)"/>
  <circle cx="256" cy="256" r="5" fill="#ffffff"/>
</svg>
